[project]
name = "token-service-client"
version = "0.1.0"
description = "TokenService Python Client SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "ruff>=0.16.0,<0.17.0",
    "mypy>=2.3.0,<3.0.0",
    # Testcontainers is optional in CI — used to run an image named 'tokenservice:local' when available
    "testcontainers>=4.15.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["token_service"]

[tool.pytest.ini_options]
# Limits pytest discovery to tests/ directory to avoid scanning .venv or build files
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E: pycodestyle errors, F: Pyflakes, I: isort, UP: pyupgrade, B: flake8-bugbear
# (Ruff's default select is ["E4", "E7", "E9", "F"])
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
# Suppress type-stub errors for 3rd-party imports lacking py.typed
ignore_missing_imports = true
files = ["token_service"]
